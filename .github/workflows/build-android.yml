name: 'Build (android)'

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      extra-conf-options:
        required: false
        type: string
      make-target:
        required: false
        type: string
        default: 'static-libs-graal-bundles'
      debug-levels:
        required: false
        type: string
        default: '[ "release" ]'
      ndk-version:
        required: true
        type: string
      api-level:
        required: true
        type: string
      configure-arguments:
        required: false
        type: string
      make-arguments:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false

jobs:
  build-android:
    name: build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        debug-level: ${{ fromJSON(inputs.debug-levels) }}

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@v6

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64

      - name: 'Install toolchain and dependencies'
        id: ndk
        run: |
          # The build tools are compiled with the host clang, the libraries with the NDK's
          sudo apt update
          sudo apt install clang
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk-version }}-linux.zip
          unzip -q ndk.zip -d "$RUNNER_TEMP" && rm ndk.zip
          echo "toolchain=$RUNNER_TEMP/android-ndk-${{ inputs.ndk-version }}/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_OUTPUT

      - name: 'Configure'
        run: >
          bash configure
          --with-conf-name=${{ inputs.platform }}
          ${{ matrix.debug-level == 'debug' && '--with-debug-level=fastdebug' || '' }}
          --with-version-opt=${GITHUB_ACTOR}-${GITHUB_SHA}
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --build=x86_64-pc-linux-gnu
          --openjdk-target=aarch64-linux-android
          --with-toolchain-type=clang
          --with-toolchain-path=${{ steps.ndk.outputs.toolchain }}/bin
          --with-sysroot=${{ steps.ndk.outputs.toolchain }}/sysroot
          CC=aarch64-linux-android${{ inputs.api-level }}-clang
          CXX=aarch64-linux-android${{ inputs.api-level }}-clang++
          BUILD_CC=clang
          BUILD_CXX=clang++
          AR=llvm-ar
          NM=llvm-nm
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          STRIP=llvm-strip
          CXXFILT=llvm-cxxfilt
          --enable-headless-only
          --with-zlib=system
          --with-jvm-variants=minimal
          ${{ inputs.extra-conf-options }} ${{ inputs.configure-arguments }} || (
          echo "Dumping config.log:" &&
          cat config.log &&
          exit 1)

      - name: 'Build'
        id: build
        uses: ./.github/actions/do-build
        with:
          make-target: '${{ inputs.make-target }} ${{ inputs.make-arguments }}'
          platform: ${{ inputs.platform }}
          debug-suffix: "${{ matrix.debug-level == 'debug' && '-debug' || '' }}"
        if: ${{ inputs.dry-run == false }}

      - name: 'Upload bundles'
        uses: ./.github/actions/upload-bundles
        with:
          platform: ${{ inputs.platform }}
          debug-suffix: "${{ matrix.debug-level == 'debug' && '-debug' || '' }}"
        if: ${{ inputs.dry-run == false }}
